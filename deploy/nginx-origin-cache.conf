# Origin cache and crawler HTML for pistachioswap.com
#
# Include this file from the public nginx server that serves
# $APP_DIR/current/build. Cloudflare will honor these Cache-Control
# values. Hashed /assets/ files may be cached for a year. / and
# /index.html must not be cached so a new deploy is visible immediately.
# /api/ is live quotes and balances.

map $http_user_agent $pistachio_index {
    default /index.html;
    ~*(Googlebot|Google-Extended|GoogleOther|bingbot|BingPreview|GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-User|anthropic-ai|PerplexityBot|CCBot|Bytespider|Applebot|Amazonbot|Slurp|DuckDuckBot|YandexBot|Baiduspider|facebookexternalhit|meta-externalagent) /landing/index.html;
}

# Hashed Vite output. File names change on every content change.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location /icons/ {
    add_header Cache-Control "public, max-age=604800" always;
}

location /networkIcons/ {
    add_header Cache-Control "public, max-age=604800" always;
}

location = /favicon.svg {
    add_header Cache-Control "public, max-age=604800" always;
}

location = /favicon.png {
    add_header Cache-Control "public, max-age=604800" always;
}

location = /favicon.ico {
    add_header Cache-Control "public, max-age=604800" always;
}

location = /og-image.png {
    add_header Cache-Control "public, max-age=604800" always;
}

location = /site.webmanifest {
    add_header Cache-Control "public, max-age=604800" always;
}

location = /apple-touch-icon.png {
    add_header Cache-Control "public, max-age=604800" always;
}

location /api/ {
    add_header Cache-Control "no-store" always;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

# Humans get the swap shell. Crawlers and assistants get the landing HTML
# at the same URL so they never download wallet JavaScript.
location = / {
    add_header Cache-Control "no-store, must-revalidate" always;
    try_files $pistachio_index =404;
}

location = /index.html {
    add_header Cache-Control "no-store, must-revalidate" always;
    try_files $pistachio_index =404;
}

location /landing/ {
    add_header Cache-Control "no-store, must-revalidate" always;
}
