# Merge these locations into the pistachioswap.com nginx `server { }`
# block that serves $APP_DIR/current/build.
#
# Why this file is not applied by `git push`:
# GitHub deploy copies HTML/JS/CSS onto the VPS and reloads the API.
# It does not edit /etc/nginx. Cache-Control is set by nginx. Cloudflare
# currently caches what origin sends (today: max-age=300 on static files).
#
# You do not also need the Cloudflare Worker if you do this merge.
# The Worker is only a fallback when nginx cannot be edited.
#
# How:
#   1. SSH to the VPS.
#   2. sudo nginx -T | less   (find the server_name pistachioswap.com block)
#   3. Replace matching location blocks, or add the ones that are missing.
#      Duplicate `location /assets/` in the same server will fail nginx -t.
#   4. Remove any site-wide `expires` / `add_header Cache-Control max-age=300`
#      that would override these.
#   5. sudo nginx -t && sudo systemctl reload nginx
#   6. curl -sI https://pistachioswap.com/favicon.svg | grep -i cache-control
#      Expect: public, max-age=604800
#      curl -sI https://pistachioswap.com/assets/<a-hashed-file> 
#      Expect: public, max-age=31536000, immutable

set $pistachio_index /index.html;
if ($http_user_agent ~* (Googlebot|Google-Extended|GoogleOther|bingbot|BingPreview|GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-User|anthropic-ai|PerplexityBot|CCBot|Bytespider|Applebot|Amazonbot|Slurp|DuckDuckBot|YandexBot|Baiduspider|facebookexternalhit|meta-externalagent)) {
    set $pistachio_index /landing/index.html;
}

# Hashed Vite output. File names change on every content change.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location /icons/ {
    add_header Cache-Control "public, max-age=604800" always;
}

location /networkIcons/ {
    add_header Cache-Control "public, max-age=604800" always;
}

location = /favicon.svg {
    add_header Cache-Control "public, max-age=604800" always;
}

location = /favicon.png {
    add_header Cache-Control "public, max-age=604800" always;
}

location = /favicon.ico {
    add_header Cache-Control "public, max-age=604800" always;
}

location = /og-image.png {
    add_header Cache-Control "public, max-age=604800" always;
}

location = /site.webmanifest {
    add_header Cache-Control "public, max-age=604800" always;
}

location = /apple-touch-icon.png {
    add_header Cache-Control "public, max-age=604800" always;
}

location /api/ {
    add_header Cache-Control "no-store" always;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

# Humans get the swap shell. Crawlers get landing HTML at the same URL.
location = / {
    add_header Cache-Control "no-store, must-revalidate" always;
    try_files $pistachio_index =404;
}

location = /index.html {
    add_header Cache-Control "no-store, must-revalidate" always;
    try_files $pistachio_index =404;
}

location /landing/ {
    add_header Cache-Control "no-store, must-revalidate" always;
}
