# Merge the location blocks below into
# /etc/nginx/sites-enabled/pistachioswap inside the 443 server
# (the one with root /opt/pistachio/current/build).
# Replace matching existing locations; do not append duplicate blocks.
# Coordinate these changes with the root/swap build. See docs/root-swap-migration.md.
#
# Do not replace location /health or location /api/. Those already
# proxy to the API. For /api/, only add the three cache lines shown
# at the bottom of this file.
#
# Nginx add_header in a location drops the server-level security
# headers, so those three headers are repeated here.
#
# Cloudflare: create a Cache Rule that marks the frontend eligible for
# cache but excludes /api/, /health, and /cdn-cgi/. Set Browser Cache TTL
# to "Respect Existing Headers". The HTML response uses max-age=0 for
# browsers and s-maxage=300 so shared caches such as Cloudflare can keep
# it for five minutes. Do not cache API responses.

# Serve the same document and canonical URL to visitors and search crawlers.
# Remove any older User-Agent-based $pistachio_index mapping when applying this file.

location /assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location /icons/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "public, max-age=604800" always;
}

location /networkIcons/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "public, max-age=604800" always;
}

location = /favicon.svg {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "public, max-age=604800" always;
}

location = /favicon.png {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "public, max-age=604800" always;
}

location = /favicon.ico {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "public, max-age=604800" always;
}

location = /og-image.png {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "public, max-age=604800" always;
}

location = /site.webmanifest {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "public, max-age=604800" always;
}

location = /apple-touch-icon.png {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "public, max-age=604800" always;
}

location = / {
    # Preserve public route-status links created when the wallet lived at root.
    if ($arg_route != "") { return 301 /swap/$is_args$args; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "public, max-age=0, s-maxage=300, must-revalidate" always;
    try_files /index.html =404;
}

location = /index.html {
    if ($arg_route != "") { return 301 /swap/$is_args$args; }
    return 301 /$is_args$args;
}

# Legacy marketing container and guide URLs are redirects only.
location = /landing { return 301 /$is_args$args; }
location = /landing/ { return 301 /$is_args$args; }
location = /landing/index.html { return 301 /$is_args$args; }
location = /landing/wallet { return 301 /wallet/$is_args$args; }
location = /landing/wallet/ { return 301 /wallet/$is_args$args; }
location = /landing/wallet/index.html { return 301 /wallet/$is_args$args; }
location = /landing/gas-assist { return 301 /gas-assist/$is_args$args; }
location = /landing/gas-assist/ { return 301 /gas-assist/$is_args$args; }
location = /landing/gas-assist/index.html { return 301 /gas-assist/$is_args$args; }
location = /landing/how-it-works { return 301 /how-it-works/$is_args$args; }
location = /landing/how-it-works/ { return 301 /how-it-works/$is_args$args; }
location = /landing/how-it-works/index.html { return 301 /how-it-works/$is_args$args; }
location = /landing/faq { return 301 /faq/$is_args$args; }
location = /landing/faq/ { return 301 /faq/$is_args$args; }
location = /landing/faq/index.html { return 301 /faq/$is_args$args; }

# Canonical trailing-slash URLs.
location = /wallet { return 301 /wallet/$is_args$args; }
location = /wallet/index.html { return 301 /wallet/$is_args$args; }
location = /gas-assist { return 301 /gas-assist/$is_args$args; }
location = /gas-assist/index.html { return 301 /gas-assist/$is_args$args; }
location = /how-it-works { return 301 /how-it-works/$is_args$args; }
location = /how-it-works/index.html { return 301 /how-it-works/$is_args$args; }
location = /faq { return 301 /faq/$is_args$args; }
location = /faq/index.html { return 301 /faq/$is_args$args; }

location = /swap { return 301 /swap/$is_args$args; }
location = /swap/index.html { return 301 /swap/$is_args$args; }
location = /swap/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-store, must-revalidate" always;
    try_files /swap/index.html =404;
}

# Do not return a 200 landing/app shell for an unknown path.
location / {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "public, max-age=0, s-maxage=300, must-revalidate" always;
    try_files $uri $uri/ =404;
}

location /landing/ {
    # Known legacy guides are exact redirects above; unknown paths stay 404.
    try_files $uri $uri/ =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "public, max-age=0, s-maxage=300, must-revalidate" always;
}

location /gas-assist/ {
    try_files $uri $uri/ =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "public, max-age=0, s-maxage=300, must-revalidate" always;
}

