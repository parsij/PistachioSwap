    <style>
      /*
       * Static boot shell shown before React mounts. It gives Lighthouse and
       * first-time visitors immediate content instead of a blank page while
       * wallet bundles download and compile.
       */
      .app-boot-shell {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 53px 12px 2rem;
        background: #191919;
        color: #fff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .app-boot-header,
      .app-boot-card {
        width: min(480px, calc(100vw - 24px));
        margin-inline: auto;
      }

      .app-boot-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 72px;
        margin-bottom: 0.5rem;
      }

      .app-boot-brand {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
      }

      .app-boot-brand img {
        width: 24px;
        height: 24px;
      }

      .app-boot-pill {
        width: 108px;
        height: 36px;
        border-radius: 999px;
        background: #252525;
      }

      .app-boot-card {
        padding: 1rem;
        border: 1px solid #353535;
        border-radius: 22px;
        background: #252525;
      }

      .app-boot-panel {
        height: 136px;
        margin-bottom: 0.5rem;
        border-radius: 18px;
        background: #191919;
      }

      .app-boot-panel:last-of-type {
        height: 132px;
      }

      .app-boot-action {
        height: 55px;
        margin-top: 0.75rem;
        border-radius: 18px;
        background: #8ac27c;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-shell" aria-hidden="true">
        <header class="app-boot-header">
          <div class="app-boot-brand">
            <img src="/icons/PistachioLogo.svg" alt="" width="24" height="24" />
            Pistachio Swap
          </div>
          <div class="app-boot-pill"></div>
        </header>
        <section class="app-boot-card" aria-hidden="true">
          <div class="app-boot-panel"></div>
          <div class="app-boot-panel"></div>
          <div class="app-boot-action"></div>
        </section>
      </div>
    </div>
    <noscript>

        <p style="color: #a9a9a9; line-height: 1.5;">
          The swap interface needs JavaScript to talk to your wallet and to price
          routes. Enable JavaScript to continue, or read what Pistachio Swap does
          on the <a href="/landing/" style="color: #8ac27c;">overview page</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
