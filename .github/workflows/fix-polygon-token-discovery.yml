name: Apply Polygon token discovery fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-polygon-token-discovery.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Patch Polygon token discovery
        run: python .github/scripts/fix_polygon_token_discovery.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter @pistachio/api typecheck

      - name: Run Polygon token tests
        run: pnpm --filter @pistachio/api test -- token-discovery-registry.test.ts token-catalog-ranking.test.ts

      - name: Lint
        run: pnpm lint

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make Polygon token discovery resilient'
          git push origin HEAD:main
