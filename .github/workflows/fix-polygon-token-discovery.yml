name: Apply Polygon token discovery fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-polygon-token-discovery.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Patch Polygon token discovery
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected patch anchor not found in {path}')
              p.write_text(text.replace(old, new, 1))

          registry = 'apps/api/src/token-discovery/registry.ts'
          replace_once(
              registry,
              "{ chainId: 137, name: 'Polygon PoS', active: true, native: { name: 'POL', symbol: 'POL', coinGeckoId: 'matic-network' }, wrappedNative:",
              "{ chainId: 137, name: 'Polygon PoS', active: true, native: { name: 'POL', symbol: 'POL', coinGeckoId: 'polygon-ecosystem-token', erc20Aliases: ['0x0000000000000000000000000000000000001010'] }, wrappedNative:",
          )

          logos = 'apps/api/src/providers/token-logos.ts'
          replace_once(
              logos,
              "    'matic-network': 'https://coin-images.coingecko.com/coins/images/4713/large/polygon.png?1698233745',\n",
              "    'matic-network': 'https://coin-images.coingecko.com/coins/images/4713/large/polygon.png?1698233745',\n    'polygon-ecosystem-token': 'https://coin-images.coingecko.com/coins/images/4713/large/polygon.png?1698233745',\n",
          )

          catalog = 'apps/api/src/modules/token-catalog.ts'
          replace_once(
              catalog,
              "    const publicTokens: PublicCatalogToken[] = tokens ?? selected.map(({ token, index }) =>\n        publicToken(token, index, identityIndex, chainScope === 'all'))\n    return {\n",
              "    let publicTokens: PublicCatalogToken[] = tokens ?? selected.map(({ token, index }) =>\n        publicToken(token, index, identityIndex, chainScope === 'all'))\n\n    // ShapeShift native CAIP IDs are not guaranteed to use slip44:60 on every\n    // EVM chain. The active-chain registry is authoritative for native assets,\n    // so a missing upstream native record must never make POL/ETH/etc.\n    // undiscoverable in a chain-specific selector.\n    if (chainScope !== 'all') {\n        const chain = getTokenDiscoveryChain(chainScope)!\n        const nativeTerms = [\n            NATIVE_TOKEN_ADDRESS,\n            chain.native.symbol,\n            chain.native.name,\n            chain.name,\n            `native ${chain.native.symbol}`,\n        ].map((value) => value.toLowerCase())\n        const nativeMatches = normalizedSearch\n            ? nativeTerms.some((value) =>\n                  value === normalizedSearch || value.includes(normalizedSearch))\n            : catalogMode === 'featured'\n        const hasNative = publicTokens.some((token) =>\n            token.address === NATIVE_TOKEN_ADDRESS)\n        if (nativeMatches && !hasNative) {\n            publicTokens = [\n                publicRegistryNativeToken(chain, -1),\n                ...publicTokens,\n            ].slice(0, Math.min(requestedLimit, normalizedSearch ? MAX_SEARCH_RESULTS : requestedLimit))\n        }\n    }\n\n    return {\n",
          )

          market = 'apps/api/src/modules/market-tokens-base.ts'
          replace_once(
              market,
              "import {\n    getFallbackTokensForAllChains,\n    getFallbackTokensForChain,\n    loadFallbackTokenCatalog,\n} from '../token-discovery/fallback-token-catalog.js'\n",
              "import {\n    getFallbackTokensForAllChains,\n    getFallbackTokensForChain,\n    loadFallbackTokenCatalog,\n} from '../token-discovery/fallback-token-catalog.js'\nimport {\n    searchFallbackTokenAddressDirectory,\n} from '../token-discovery/fallback-token-addresses.js'\n",
          )
          old_search = """    async function getTextSearch(chainId: number, query: string) {
        let candidates: TokenCandidate[] = []
        let markets = new Map<string, TokenMarket>()

        try {
            candidates = await resolved.searchCandidates(query, undefined, chainId)
        } catch {}
        if (candidates.length > 0) {
            try {
                markets = asMarketResult(
                    await resolved.fetchMarkets(
                        candidates.map((candidate) => candidate.address),
                        undefined,
                        chainId,
                    ),
                ).markets
            } catch {}
        } else {
            try {
                const fallbackMarkets = await resolved.searchMarkets(query, undefined, chainId)
                markets = new Map(
                    fallbackMarkets.map((market) => [market.address, market]),
                )
                candidates = fallbackMarkets.map(candidateFromMarket)
            } catch {}
        }

        if (candidates.length === 0) {
            return []
        }
        const tokens = await enrichSearchCandidates({
            chainId,
            candidates: candidates.slice(0, 20),
            markets,
            dependencies: resolved,
        })
        return rankBroaderSearch(tokens, query)
    }
"""
          new_search = """    async function getTextSearch(chainId: number, query: string) {
        // Search providers independently and merge them with the reviewed local
        // fallback-address directory. A provider outage or incomplete Polygon
        // index must not turn a known token search into an empty result.
        const [candidateResult, marketSearchResult, fallbackResult] =
            await Promise.allSettled([
                resolved.searchCandidates(query, undefined, chainId),
                resolved.searchMarkets(query, undefined, chainId),
                searchFallbackTokenAddressDirectory(query),
            ])

        const providerCandidates = candidateResult.status === 'fulfilled'
            ? candidateResult.value
            : []
        const marketValues = marketSearchResult.status === 'fulfilled'
            ? marketSearchResult.value
            : []
        const localCandidates: TokenCandidate[] = fallbackResult.status === 'fulfilled'
            ? fallbackResult.value
                  .filter((entry) => entry.chainId === chainId)
                  .slice(0, 20)
                  .map((entry) => ({
                      address: entry.address,
                      name: entry.name,
                      symbol: entry.symbol,
                      decimals: null,
                      imageUrl: null,
                      coinGeckoId: null,
                      priceUSD: null,
                      imageSource: null,
                  }))
            : []
        const candidates = uniqueCandidates([
            ...providerCandidates,
            ...marketValues.map(candidateFromMarket),
            ...localCandidates,
        ]).slice(0, 20)
        if (candidates.length === 0) return []

        let markets = new Map(
            marketValues.map((market) => [market.address, market]),
        )
        try {
            const directMarkets = asMarketResult(
                await resolved.fetchMarkets(
                    candidates.map((candidate) => candidate.address),
                    undefined,
                    chainId,
                ),
            ).markets
            markets = new Map([...markets, ...directMarkets])
        } catch {
            // Search remains useful from local metadata + RPC/Alchemy metadata.
        }

        const tokens = await enrichSearchCandidates({
            chainId,
            candidates,
            markets,
            dependencies: resolved,
        })
        return rankBroaderSearch(tokens, query)
    }
"""
          replace_once(market, old_search, new_search)

          registry_test = 'apps/api/test/token-discovery-registry.test.ts'
          replace_once(
              registry_test,
              "    UNCHAINED_EVM_COINSTACKS_BY_CHAIN_ID,\n    getTokenDiscoveryChain,\n",
              "    UNCHAINED_EVM_COINSTACKS_BY_CHAIN_ID,\n    canonicalTokenAddress,\n    getTokenDiscoveryChain,\n",
          )
          replace_once(
              registry_test,
              "        expect(getTokenDiscoveryChain(137)?.providers.coinGeckoNetwork)\n            .toBe('polygon_pos')\n",
              "        expect(getTokenDiscoveryChain(137)?.providers.coinGeckoNetwork)\n            .toBe('polygon_pos')\n        expect(getTokenDiscoveryChain(137)?.native).toMatchObject({\n            symbol: 'POL',\n            coinGeckoId: 'polygon-ecosystem-token',\n        })\n        expect(canonicalTokenAddress(\n            137,\n            '0x0000000000000000000000000000000000001010',\n        )).toBe(NATIVE_TOKEN_ADDRESS)\n",
          )

          ranking_test = 'apps/api/test/token-catalog-ranking.test.ts'
          replace_once(
              ranking_test,
              "    it('gives wrapped native tokens shared and chain-logo icon fallbacks', async () => {\n",
              "    it('keeps Polygon POL discoverable from the active-chain registry', async () => {\n        const app = createApp()\n        const response = await app.inject({\n            method: 'GET',\n            url: '/v1/token-catalog?chainId=137&mode=all&search=POL&limit=20',\n        })\n        await app.close()\n\n        expect(response.statusCode).toBe(200)\n        expect(response.json().tokens[0]).toMatchObject({\n            chainId: 137,\n            address: '0x0000000000000000000000000000000000000000',\n            symbol: 'POL',\n            isNative: true,\n        })\n    })\n\n    it('gives wrapped native tokens shared and chain-logo icon fallbacks', async () => {\n",
          )

          workflow = Path('.github/workflows/fix-polygon-token-discovery.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter @pistachio/api typecheck

      - name: Run Polygon/token discovery tests
        run: pnpm --filter @pistachio/api test -- token-discovery-registry.test.ts token-catalog-ranking.test.ts

      - name: Lint
        run: pnpm lint

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make Polygon token discovery resilient'
          git push origin HEAD:main
