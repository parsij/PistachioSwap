name: Apply Polygon wallet balance fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-polygon-wallet-balances.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Patch Polygon Portfolio response handling
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected patch anchor not found in {path}')
              p.write_text(text.replace(old, new, 1))

          networks = 'apps/api/src/providers/alchemy/portfolio-networks.ts'
          replace_once(
              networks,
              "const byChainId = new Map<number, AlchemyPortfolioNetwork>()\nconst byNetwork = new Map<AlchemyPortfolioNetwork, number>()\n",
              "const byChainId = new Map<number, AlchemyPortfolioNetwork>()\nconst byNetwork = new Map<AlchemyPortfolioNetwork, number>()\n\n// Portfolio requests use polygon-mainnet, while Alchemy's Tokens By Wallet\n// response currently labels Polygon rows as matic-mainnet. Keep request IDs\n// canonical and accept documented response aliases only when decoding rows.\nconst responseNetworkAliases: ReadonlyMap<string, number> = new Map([\n    ['matic-mainnet', 137],\n])\n",
          )
          replace_once(
              networks,
              "export function getChainIdForAlchemyPortfolioNetwork(network: string) {\n    return byNetwork.get(network as AlchemyPortfolioNetwork) ?? null\n}\n",
              "export function getChainIdForAlchemyPortfolioNetwork(network: string) {\n    return byNetwork.get(network as AlchemyPortfolioNetwork) ??\n        responseNetworkAliases.get(network) ??\n        null\n}\n",
          )

          provider = 'apps/api/src/providers/alchemy/portfolio-tokens.ts'
          replace_once(
              provider,
              "    const chainIds = networkBatch.map((network) =>\n        getChainIdForAlchemyPortfolioNetwork(network)!,\n    )\n    const allowedNetworks = new Set(networkBatch)\n",
              "    const chainIds = networkBatch.map((network) =>\n        getChainIdForAlchemyPortfolioNetwork(network)!,\n    )\n    const allowedChainIds = new Set(chainIds)\n",
          )
          replace_once(
              provider,
              "            const chainId = allowedNetworks.has(returnedNetwork as AlchemyPortfolioNetwork)\n                ? getChainIdForAlchemyPortfolioNetwork(returnedNetwork)\n                : null\n",
              "            const returnedChainId =\n                getChainIdForAlchemyPortfolioNetwork(returnedNetwork)\n            const chainId = returnedChainId !== null &&\n                allowedChainIds.has(returnedChainId)\n                ? returnedChainId\n                : null\n",
          )

          tests = 'apps/api/test/alchemy-portfolio-tokens.test.ts'
          replace_once(
              tests,
              "        expect(getAlchemyPortfolioNetwork(56)).toBe('bnb-mainnet')\n",
              "        expect(getAlchemyPortfolioNetwork(56)).toBe('bnb-mainnet')\n        expect(getAlchemyPortfolioNetwork(137)).toBe('polygon-mainnet')\n        expect(getChainIdForAlchemyPortfolioNetwork('matic-mainnet')).toBe(137)\n",
          )
          replace_once(
              tests,
              "    it.each([\n        [1, 1],\n",
              "    it('accepts Alchemy Polygon response aliases without weakening batch isolation', async () => {\n        const fetchImpl = vi.fn(async (_url, options) => {\n            const body = JSON.parse(String(options?.body))\n            expect(body.addresses[0].networks).toEqual(['polygon-mainnet'])\n            return response([record({\n                network: 'matic-mainnet',\n                tokenAddress: null,\n                tokenBalance: '0x2a',\n                tokenMetadata: {\n                    decimals: 18,\n                    logo: 'https://static.alchemy.example/pol.png',\n                    name: 'Polygon',\n                    symbol: 'POL',\n                },\n                tokenPrices: [{ currency: 'usd', value: '0.25' }],\n            })])\n        })\n        const result = await fetchAlchemyPortfolioTokens({\n            walletAddress: wallet,\n            chainIds: [137],\n        }, { fetchImpl, config })\n\n        expect(result.tokens).toEqual([expect.objectContaining({\n            chainId: 137,\n            address: NATIVE_TOKEN_ADDRESS,\n            isNative: true,\n            rawBalance: '42',\n        })])\n        expect(result.successfulChainIds).toEqual([137])\n        expect(result.skippedRecordCount).toBe(0)\n    })\n\n    it.each([\n        [1, 1],\n",
          )

          workflow = Path('.github/workflows/fix-polygon-wallet-balances.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API typecheck
        run: pnpm --filter @pistachio/api typecheck

      - name: Run wallet provider tests
        run: pnpm --filter @pistachio/api test -- alchemy-portfolio-tokens.test.ts alchemy-portfolio-cache.test.ts wallet-token-route.test.ts

      - name: Lint
        run: pnpm lint

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore Polygon wallet balances'
          git push origin HEAD:main
