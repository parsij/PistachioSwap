name: Temporary compliance env validation

on:
  push:
    branches:
      - fix/compliance-env-audit

permissions:
  contents: read

jobs:
  focused-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Shared env sync tests
        run: pnpm exec vitest run test/shared-api-env-sync.test.js
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
