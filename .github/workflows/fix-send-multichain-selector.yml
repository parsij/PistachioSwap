name: Apply send multichain selector fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-send-multichain-selector.yml'
      - '.github/scripts/fix-send-multichain-selector.py'
      - '.github/scripts/fix-send-test-query.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: npm install --global pnpm@10.30.3

      - name: Patch Send token selector
        run: |
          python .github/scripts/fix-send-multichain-selector.py
          python .github/scripts/fix-send-test-query.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused tests
        run: pnpm vitest run src/features/wallet/components/wallet/SendAssetDialog.test.jsx src/features/tokens/components/TokenSelector.test.jsx

      - name: Lint
        run: pnpm lint

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-send-multichain-selector.yml
          rm .github/scripts/fix-send-multichain-selector.py
          rm .github/scripts/fix-send-test-query.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: unify Send token selector across chains'
          git pull --rebase origin main
          git push origin HEAD:main
