name: Apply send multichain selector fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-send-multichain-selector.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Patch send token selector
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # Reuse the production swap selector in a wallet-only mode so Send is
          # visually and behaviorally identical without inventing a second UI.
          path = Path('src/features/tokens/components/TokenSelector.jsx')
          text = path.read_text()
          text = replace_once(
              text,
              " * @param {'sell'|'buy'} props.side Side whose token is being selected; used only for the dialog label.\n",
              " * @param {'sell'|'buy'|'send'} props.side Side whose token is being selected; used only for the dialog label.\n * @param {boolean} [props.walletOnly] Restricts the selector to wallet-owned holdings while preserving the exact selector UI.\n",
              'TokenSelector docs',
          )
          text = replace_once(
              text,
              "    onChainChange = null,\n}) {",
              "    onChainChange = null,\n    walletOnly = false,\n}) {",
              'TokenSelector prop',
          )
          text = replace_once(
              text,
              "        if (state.normalizedSearch || chainId === 'all') return\n",
              "        if (walletOnly || state.normalizedSearch || chainId === 'all') return\n",
              'TokenSelector scroll guard',
          )
          text = replace_once(
              text,
              "<Sections state={state} loading={loading} currentToken={currentToken} oppositeToken={oppositeToken} hideUnknownTokens={hideUnknownTokens} />",
              "<Sections state={state} loading={loading} currentToken={currentToken} oppositeToken={oppositeToken} hideUnknownTokens={hideUnknownTokens} walletOnly={walletOnly} />",
              'TokenSelector sections',
          )
          path.write_text(text)

          path = Path('src/features/tokens/components/TokenSelectorSections.jsx')
          text = path.read_text()
          text = replace_once(
              text,
              "export function TokenSelectorSections({ state, loading, currentToken, oppositeToken, hideUnknownTokens }) {\n",
              "export function TokenSelectorSections({ state, loading, currentToken, oppositeToken, hideUnknownTokens, walletOnly = false }) {\n",
              'TokenSelectorSections prop',
          )
          text = replace_once(
              text,
              "    const marketUnavailable = state.sortedGlobalMarketTokens.length === 0 && !loading\n",
              "    const marketUnavailable = !walletOnly && state.sortedGlobalMarketTokens.length === 0 && !loading\n",
              'market unavailable guard',
          )
          text = replace_once(
              text,
              "        {state.visibleRecentTokens.length > 0 && <section className=\"ps-token-section\"><SectionTitle icon={<ClockIcon />} action={<button type=\"button\" className=\"ps-token-section-action\" onClick={state.clearRecentTokens}>Clear</button>}>Recent searches</SectionTitle>{state.visibleRecentTokens.map((token) => row(token, hasPositiveBalance(token)))}</section>}\n        {(state.sortedGlobalMarketTokens.length > 0 || loading) && <section className=\"ps-token-section\"><SectionTitle icon={<TrendingIcon />}>Tokens</SectionTitle>{loading && state.sortedGlobalMarketTokens.length === 0 ? <TokenSkeletonList /> : <>{state.marketStatusMessage && <div className=\"ps-token-inline-status\" role=\"status\">{state.marketStatusMessage}</div>}{state.sortedGlobalMarketTokens.map((token) => row(token))}</>}</section>}\n        {marketUnavailable && <div className=\"ps-token-inline-status\" role=\"status\">{TOKEN_DATA_UNAVAILABLE_MESSAGE}<span hidden>Token catalog is temporarily unavailable.</span></div>}\n        {state.commonMarketTokens.length > 0 && <section className=\"ps-token-section\"><SectionTitle>Tokens</SectionTitle>{state.commonMarketTokens.map((token) => row(token))}</section>}\n",
              "        {!walletOnly && state.visibleRecentTokens.length > 0 && <section className=\"ps-token-section\"><SectionTitle icon={<ClockIcon />} action={<button type=\"button\" className=\"ps-token-section-action\" onClick={state.clearRecentTokens}>Clear</button>}>Recent searches</SectionTitle>{state.visibleRecentTokens.map((token) => row(token, hasPositiveBalance(token)))}</section>}\n        {!walletOnly && (state.sortedGlobalMarketTokens.length > 0 || loading) && <section className=\"ps-token-section\"><SectionTitle icon={<TrendingIcon />}>Tokens</SectionTitle>{loading && state.sortedGlobalMarketTokens.length === 0 ? <TokenSkeletonList /> : <>{state.marketStatusMessage && <div className=\"ps-token-inline-status\" role=\"status\">{state.marketStatusMessage}</div>}{state.sortedGlobalMarketTokens.map((token) => row(token))}</>}</section>}\n        {marketUnavailable && <div className=\"ps-token-inline-status\" role=\"status\">{TOKEN_DATA_UNAVAILABLE_MESSAGE}<span hidden>Token catalog is temporarily unavailable.</span></div>}\n        {!walletOnly && state.commonMarketTokens.length > 0 && <section className=\"ps-token-section\"><SectionTitle>Tokens</SectionTitle>{state.commonMarketTokens.map((token) => row(token))}</section>}\n",
              'wallet-only sections',
          )
          path.write_text(text)

          path = Path('src/features/wallet/components/wallet/SendAssetDialog.jsx')
          text = path.read_text()
          text = text.replace('    Search,\n', '')
          text = replace_once(
              text,
              "import {\n    usePublicClient,\n    useSendTransaction,\n    useWriteContract,\n} from '#wallet-runtime'\n\nimport TokenIcon from '../../../tokens/components/TokenIcon.jsx'\nimport TransactionStatusDialog from './TransactionStatusDialog.jsx'\nimport WalletAssetList from './WalletAssetList.jsx'\n",
              "import {\n    useAppKitNetwork,\n    usePublicClient,\n    useSendTransaction,\n    useWriteContract,\n} from '#wallet-runtime'\n\nimport TokenIcon from '../../../tokens/components/TokenIcon.jsx'\nimport TokenSelector from '../../../tokens/components/TokenSelector.jsx'\nimport TransactionStatusDialog from './TransactionStatusDialog.jsx'\n",
              'Send imports',
          )
          text = re.sub(
              r"\nfunction matchesExactContract\(token, search\) \{.*?\n\}\n",
              "\n",
              text,
              count=1,
              flags=re.S,
          )

          start = text.index('}) {\n    const numericChainId = Number(chainId)')
          end = text.index('\n    function updateAmount(event) {', start)
          replacement = '''}) {
    const numericWalletChainId = Number(chainId)
    const { chainId: connectedChainId, switchNetwork } = useAppKitNetwork()
    const { mutateAsync: sendTransactionAsync } = useSendTransaction()
    const { mutateAsync: writeContractAsync } = useWriteContract()
    const [selectedToken, setSelectedToken] = useState(null)
    const [showSelector, setShowSelector] = useState(false)
    const [selectorChainId, setSelectorChainId] = useState('all')
    const [search, setSearch] = useState('')
    const [amount, setAmount] = useState('')
    const [recipient, setRecipient] = useState('')
    const [error, setError] = useState(null)
    const [mode, setMode] = useState('edit')
    const [status, setStatus] = useState('idle')
    const [review, setReview] = useState(null)
    const [hash, setHash] = useState(null)
    const heldAssets = assets.filter(isPositiveWalletBalance)
    const defaultSelectedToken = sortWalletAssetsByValue(filterPortfolioTokens(
        heldAssets,
        settings,
    ))[0] ?? null
    const activeSelectedToken = selectedToken ?? defaultSelectedToken
    const numericChainId = Number(activeSelectedToken?.chainId ?? numericWalletChainId)
    const chain = getCuratedEvmChain(numericChainId)
    const nativeSymbol = chain?.nativeCurrency?.symbol ?? 'native token'
    const publicClient = usePublicClient({
        chainId: isCuratedEvmChainId(numericChainId)
            ? numericChainId
            : undefined,
    })
    const selectedNativeAsset = assets.find((token) =>
        Number(token?.chainId) === numericChainId && isNativeEvmToken(token)) ?? null
    const selectedNativeBalanceWei = selectedNativeAsset
        ? getTokenBalanceWei(selectedNativeAsset)
        : numericChainId === numericWalletChainId
            ? BigInt(nativeBalanceWei ?? 0)
            : 0n
    const selectedExplorerUrl = chain?.blockExplorers?.default?.url ?? explorerUrl
    const reviewedAccountChanged = Boolean(
        review?.account &&
        review.account.toLowerCase() !== String(address).toLowerCase(),
    )
    const currentMode = reviewedAccountChanged ? 'edit' : mode
    const displayError = reviewedAccountChanged
        ? 'The connected account changed. Review the send again.'
        : error
'''
          text = text[:start] + replacement + text[end:]

          text = replace_once(text, '            nativeBalanceWei,\n            estimatedFeeWei: review?.feeWei ?? null,', '            nativeBalanceWei: selectedNativeBalanceWei,\n            estimatedFeeWei: review?.feeWei ?? null,', 'useMax balance')
          text = replace_once(text, '                chainId,\n                recipient,\n                amount,\n                token: activeSelectedToken,\n                nativeBalanceWei,\n                estimatedFeeWei: 0n,', '                chainId: numericChainId,\n                recipient,\n                amount,\n                token: activeSelectedToken,\n                nativeBalanceWei: selectedNativeBalanceWei,\n                estimatedFeeWei: 0n,', 'initial transfer plan')
          text = replace_once(text, '                chainId,\n                recipient,\n                amount,\n                token: activeSelectedToken,\n                nativeBalanceWei,\n                estimatedFeeWei: feeWei,', '                chainId: numericChainId,\n                recipient,\n                amount,\n                token: activeSelectedToken,\n                nativeBalanceWei: selectedNativeBalanceWei,\n                estimatedFeeWei: feeWei,', 'final transfer plan')

          mismatch = '''        if (Number(chainId) !== Number(review.plan.request.chainId)) {
            setMode('edit')
            setReview(null)
            setStatus('idle')
            setError('The active network changed. Switch back and review again.')
            return
        }
'''
          text = replace_once(text, mismatch, '', 'remove manual network blocker')
          text = replace_once(
              text,
              "        setError(null)\n        setStatus('confirming')\n        try {\n            let transactionHash\n",
              "        const targetChain = getCuratedEvmChain(Number(review.chainId))\n        if (!targetChain) {\n            setError('This network is not enabled in PistachioSwap.')\n            return\n        }\n        setError(null)\n        setStatus('confirming')\n        let phase = 'switch-network'\n        try {\n            if (Number(connectedChainId) !== Number(review.chainId)) {\n                await switchNetwork(targetChain)\n            }\n            phase = 'send'\n            let transactionHash\n",
              'auto switch before send',
          )
          text = replace_once(
              text,
              "                setStatus('rejected')\n                setError('The send was rejected in the wallet.')\n",
              "                setStatus('rejected')\n                setError(phase === 'switch-network'\n                    ? `Network switch to ${targetChain.name} was cancelled.`\n                    : 'The send was rejected in the wallet.')\n",
              'network rejection message',
          )
          text = replace_once(text, '? formatEther(BigInt(nativeBalanceWei ?? 0))', '? formatEther(selectedNativeBalanceWei)', 'native token balance')
          text = replace_once(text, '? BigInt(nativeBalanceWei ?? 0)\n                : getTokenBalanceWei(review.token))', '? selectedNativeBalanceWei\n                : getTokenBalanceWei(review.token))', 'after native balance')
          text = replace_once(text, '<Dialog.Title>{showSelector ? \'Select token\' : \'Send\'}</Dialog.Title>', '<Dialog.Title>Send</Dialog.Title>', 'send title')

          pattern = re.compile(r'''                    \{showSelector \? \(\n                        <div className="send-token-selector">.*?\n                        </div>\n                    \) : \(\n                        <>''', re.S)
          text, count = pattern.subn("                    {!showSelector && (\n                        <>", text, count=1)
          if count != 1:
              raise SystemExit(f'send selector branch: expected 1 match, found {count}')

          text = replace_once(text, '<TransactionStatusDialog status={status} hash={hash} explorerUrl={explorerUrl} />', '<TransactionStatusDialog status={status} hash={hash} explorerUrl={selectedExplorerUrl} />', 'send explorer')
          text = replace_once(
              text,
              "                </Dialog.Content>\n            </Dialog.Portal>",
              "                </Dialog.Content>\n                {showSelector && (\n                    <TokenSelector\n                        side=\"send\"\n                        chainId={selectorChainId}\n                        tokens={[]}\n                        commonTokens={[]}\n                        fallbackTokens={[]}\n                        walletTokens={heldAssets}\n                        search={search}\n                        loading={false}\n                        error={null}\n                        currentToken={null}\n                        oppositeToken={null}\n                        onSearchChange={setSearch}\n                        onSelect={(token) => {\n                            setSelectedToken(token)\n                            setShowSelector(false)\n                            setSelectorChainId('all')\n                            setSearch('')\n                            setAmount('')\n                            setReview(null)\n                            setStatus('idle')\n                            setError(null)\n                        }}\n                        onClose={() => {\n                            setShowSelector(false)\n                            setSelectorChainId('all')\n                            setSearch('')\n                        }}\n                        hideUnknownTokens={false}\n                        hideSmallBalances={false}\n                        onChainChange={setSelectorChainId}\n                        walletOnly\n                    />\n                )}\n            </Dialog.Portal>",
              'mount exact selector',
          )
          path.write_text(text)

          path = Path('src/features/wallet/components/wallet/SendAssetDialog.test.jsx')
          text = path.read_text()
          text = replace_once(
              text,
              "    write: vi.fn(),\n    publicClient: {",
              "    write: vi.fn(),\n    switchNetwork: vi.fn(),\n    runtimeChainId: 56,\n    publicClient: {",
              'test mocks state',
          )
          text = replace_once(
              text,
              "vi.mock('#wallet-runtime', () => ({\n    usePublicClient: () => mocks.publicClient,",
              "vi.mock('#wallet-runtime', () => ({\n    useAppKitNetwork: () => ({ chainId: mocks.runtimeChainId, switchNetwork: mocks.switchNetwork }),\n    usePublicClient: () => mocks.publicClient,",
              'test runtime mock',
          )
          text = replace_once(
              text,
              "const blocked = {",
              "const polygonNative = {\n    ...native,\n    chainId: 137,\n    name: 'Polygon',\n    symbol: 'POL',\n    rawBalance: parseEther('2').toString(),\n    balance: '2',\n    priceUSD: '1',\n    valueUSD: '2',\n    logoURI: '/icons/polygon.svg',\n}\nconst blocked = {",
              'polygon fixture',
          )
          text = replace_once(
              text,
              "    beforeEach(() => window.localStorage.clear())",
              "    beforeEach(() => {\n        window.localStorage.clear()\n        mocks.runtimeChainId = 56\n        mocks.switchNetwork.mockResolvedValue(undefined)\n    })",
              'test beforeEach',
          )
          text = text.replace("screen.getByLabelText('Search wallet assets')", "screen.getByLabelText('Search tokens')")
          text = text.replace("screen.getByRole('button', { name: 'Hidden tokens (1)' })", "screen.getByText('Unverified token', { selector: '.ps-token-section-heading' })")

          insert_at = text.index("    it('requires an extra acknowledgement before reviewing a blocked token'")
          multichain_test = '''    it('uses the exact token selector across all wallet chains and auto-switches on send', async () => {
        mocks.send.mockResolvedValue('0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb')
        renderDialog({ assets: [native, polygonNative] })

        fireEvent.click(screen.getByRole('button', { name: /BNB/ }))
        expect(screen.getByRole('dialog', { name: 'Select a token for send' })).toBeTruthy()
        expect(screen.getByText('Your tokens')).toBeTruthy()
        expect(screen.getByText('Polygon')).toBeTruthy()
        expect(screen.queryByText('Show all wallet assets')).toBeNull()
        expect(screen.queryByText('Use portfolio filters')).toBeNull()
        expect(screen.queryByText("Token data couldn't be reached.")).toBeNull()

        fireEvent.click(screen.getByText('Polygon').closest('button'))
        fireEvent.change(screen.getByLabelText('Amount to send'), { target: { value: '0.5' } })
        fireEvent.change(screen.getByLabelText('Send to'), { target: { value: recipient } })
        fireEvent.click(screen.getByRole('button', { name: 'Review send' }))

        await screen.findByRole('heading', { name: 'Review send' })
        expect(screen.getByText('Polygon')).toBeTruthy()
        fireEvent.click(screen.getByRole('button', { name: 'Confirm in wallet' }))

        await waitFor(() => expect(mocks.switchNetwork).toHaveBeenCalledOnce())
        expect(mocks.switchNetwork).toHaveBeenCalledWith(expect.objectContaining({ id: 137 }))
        await waitFor(() => expect(mocks.send).toHaveBeenCalledWith(expect.objectContaining({ chainId: 137 })))
    })

'''
          text = text[:insert_at] + multichain_test + text[insert_at:]
          path.write_text(text)
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused tests
        run: pnpm vitest run src/features/wallet/components/wallet/SendAssetDialog.test.jsx src/features/tokens/components/TokenSelector.test.jsx

      - name: Lint
        run: pnpm lint

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-send-multichain-selector.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/tokens/components/TokenSelector.jsx \
                  src/features/tokens/components/TokenSelectorSections.jsx \
                  src/features/wallet/components/wallet/SendAssetDialog.jsx \
                  src/features/wallet/components/wallet/SendAssetDialog.test.jsx \
                  .github/workflows/fix-send-multichain-selector.yml
          git commit -m 'fix: unify Send token selector across chains'
          git pull --rebase origin main
          git push origin HEAD:main
