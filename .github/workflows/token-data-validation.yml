name: Token data validation

on:
  pull_request:
    paths:
      - '.github/workflows/token-data-validation.yml'
      - 'apps/api/src/app.ts'
      - 'apps/api/src/modules/token-catalog.ts'
      - 'apps/api/src/modules/uniswap-volume-tokens.ts'
      - 'apps/api/src/modules/wallet-tokens.ts'
      - 'apps/api/src/modules/wallet-activity.ts'
      - 'apps/api/src/token-discovery/**'
      - 'apps/api/src/providers/unchained/**'
      - 'apps/api/test/shapeshift-asset-catalog.test.ts'
      - 'apps/api/test/token-catalog-ranking.test.ts'
      - 'apps/api/test/unchained-wallet-tokens.test.ts'
      - 'apps/api/test/wallet-token-route.test.ts'
      - 'apps/api/test/wallet-activity.test.ts'
      - 'src/features/tokens/components/TokenIcon.jsx'
      - 'src/features/tokens/components/TokenIcon.test.jsx'
      - 'src/features/tokens/components/TokenIconLoading.css'
      - 'src/features/tokens/components/TokenSelector.jsx'
      - 'src/features/tokens/components/TokenSelector.test.jsx'
      - 'src/features/tokens/hooks/useTokenCatalog.js'
      - 'src/features/tokens/hooks/useTokenCatalog.test.jsx'
      - 'src/features/tokens/hooks/useTokenCatalogController.js'
      - 'src/features/tokens/hooks/useTokenSelectorState.js'
      - 'src/features/tokens/hooks/useWalletTokens.js'
      - 'src/features/tokens/services/walletTokens.js'
      - 'src/features/wallet/services/walletActivity.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter @pistachio/api typecheck

      - name: Test balanced all-chain defaults
        run: >-
          pnpm --filter @pistachio/api exec vitest run
          test/token-catalog-ranking.test.ts
          -t "returns a balanced all-chain featured list"
          --reporter=verbose

      - name: Test all-chain XAUT coverage
        run: >-
          pnpm --filter @pistachio/api exec vitest run
          test/token-catalog-ranking.test.ts
          -t "searches the complete all-chain ShapeShift catalog"
          --reporter=verbose

      - name: Test wrapped-native icon fallbacks
        run: >-
          pnpm --filter @pistachio/api exec vitest run
          test/token-catalog-ranking.test.ts
          -t "gives wrapped native tokens shared"
          --reporter=verbose

      - name: Test wallet history regression
        run: >-
          pnpm --filter @pistachio/api exec vitest run
          test/wallet-activity.test.ts
          --reporter=verbose

      - name: Test wallet balance regression
        run: >-
          pnpm --filter @pistachio/api exec vitest run
          test/wallet-token-route.test.ts
          --reporter=verbose

      - name: Test backend token data
        run: >-
          pnpm --filter @pistachio/api exec vitest run
          test/unchained-wallet-tokens.test.ts
          test/shapeshift-asset-catalog.test.ts
          test/token-catalog-ranking.test.ts
          --reporter=verbose

      - name: Test frontend token catalog
        run: >-
          pnpm exec vitest run
          src/features/tokens/hooks/useTokenCatalog.test.jsx
          src/features/tokens/components/TokenIcon.test.jsx
          src/features/tokens/components/TokenSelector.test.jsx
          --reporter=verbose

      - name: Lint changed token files
        run: >-
          pnpm exec oxlint
          src/features/tokens/hooks/useTokenCatalog.js
          src/features/tokens/hooks/useTokenCatalogController.js
          src/features/tokens/hooks/useTokenSelectorState.js
          src/features/tokens/hooks/useWalletTokens.js
          src/features/tokens/components/TokenIcon.jsx
          src/features/tokens/components/TokenIcon.test.jsx
          src/features/tokens/components/TokenSelector.jsx
          src/features/tokens/services/walletTokens.js
          src/features/wallet/services/walletActivity.js

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Full lint
        run: pnpm lint

      - name: Full unit suite
        run: pnpm test

      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build

      - name: Third-party license audit
        run: pnpm licenses:audit

      - name: Public release tree audit
        run: pnpm release-tree:audit

      - name: Private Gas Assist boundary audit
        run: pnpm audit:private-gas-assist-boundary
