name: Finalize OFAC compliance once

on:
  push:
    branches:
      - feature/ofac-compliance
    paths:
      - apps/api/test/gas-assist-proxy-geo.test.ts
      - .github/workflows/apply-ofac-compliance-once.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ofac-compliance
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Harden Cloudflare geo forwarding
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'apps/api/src/modules/gas-assist-proxy.ts'
          let source = fs.readFileSync(path, 'utf8')
          const before = [
            "    const country = request.headers['cf-ipcountry']",
            "    if (typeof country === 'string' && /^[A-Za-z]{2}$/.test(country)) {",
            "        headers.set('x-pistachio-client-country', country.toUpperCase())",
            "    }",
            "    const region = request.headers['cf-region-code']",
            "    if (typeof region === 'string' && /^[A-Za-z0-9-]{1,16}$/.test(region)) {",
            "        headers.set('x-pistachio-client-region', region.toUpperCase())",
            "    }",
            "",
          ].join('\n')
          const after = [
            "    if (readBoolean('COMPLIANCE_TRUST_CLOUDFLARE_GEO', false)) {",
            "        const connectingIp = request.headers['cf-connecting-ip']",
            "        const ray = request.headers['cf-ray']",
            "        const trustedCloudflareRequest =",
            "            typeof connectingIp === 'string' &&",
            "            connectingIp.trim() === request.ip &&",
            "            typeof ray === 'string' &&",
            "            /^[A-Za-z0-9-]{8,64}$/.test(ray.trim())",
            "",
            "        if (trustedCloudflareRequest) {",
            "            const country = request.headers['cf-ipcountry']",
            "            if (typeof country === 'string' && /^[A-Za-z]{2}$/.test(country)) {",
            "                headers.set('x-pistachio-client-country', country.toUpperCase())",
            "            }",
            "            const region = request.headers['cf-region-code']",
            "            if (typeof region === 'string' && /^[A-Za-z0-9-]{1,16}$/.test(region)) {",
            "                headers.set('x-pistachio-client-region', region.toUpperCase())",
            "            }",
            "        }",
            "    }",
            "",
          ].join('\n')
          if (!source.includes(before)) throw new Error('geo forwarding block not found')
          source = source.replace(before, after)
          source = source.replace(
            '    readBoundedResponse,\n}',
            '    readBoundedResponse,\n    proxyHeaders,\n}',
          )
          fs.writeFileSync(path, source)
          NODE
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: |
          pnpm --filter @pistachio/api typecheck
          pnpm --filter @pistachio/api test
          pnpm exec vitest run apps/api/test/gas-assist-proxy-geo.test.ts
      - name: Commit final code
        run: |
          git checkout -- .github/workflows/apply-ofac-compliance-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/modules/gas-assist-proxy.ts apps/api/test/gas-assist-proxy-geo.test.ts
          git commit -m "fix: harden compliance geo forwarding"
          git push origin HEAD:feature/ofac-compliance
