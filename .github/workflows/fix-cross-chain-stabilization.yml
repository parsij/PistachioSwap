name: Fix cross-chain sponsorship stabilization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cross-chain-stabilization.yml'

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.30.3'
  PATCH_SCRIPT_B64: 

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Patch same-provider stabilization
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused tests
        run: pnpm vitest run apps/api/test/cross-chain-requote-provider.test.ts apps/api/test/cross-chain.test.ts
      - name: Lint
        run: pnpm lint
      - name: API typecheck
        run: pnpm --filter @pistachio/api typecheck
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/cross-chain/registry.ts apps/api/src/cross-chain/service.ts apps/api/test/cross-chain-requote-provider.test.ts
          git commit -m 'Fix cross-chain Gas Assist route stabilization'
          git push origin HEAD:main
