name: Temporary PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.30.3'

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: API typecheck
        run: pnpm --filter @pistachio/api typecheck
      - name: App wallet tests
        continue-on-error: true
        run: pnpm exec vitest run src/App.wallet.test.jsx
      - name: Quote service tests
        continue-on-error: true
        run: pnpm exec vitest run src/features/swap/services/quotes.test.js
      - name: Refreshed quote tests
        continue-on-error: true
        run: pnpm exec vitest run src/features/swap/services/refreshedQuoteValidation.test.js
      - name: Full tests
        run: pnpm test
