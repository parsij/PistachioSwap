name: Apply swap feedback and rate-limit fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-swap-feedback.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Patch swap feedback and rate-limit behavior
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected patch anchor not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Zero/empty amounts must not pretend Gas Assist is loading.
          path = 'src/features/cross-chain/hooks/useCrossChainGasAssist.js'
          replace_once(
              path,
              "    const grossInputAmount = String(totalInputRaw ?? '')\n    const routeSetKey = candidateRoutes\n",
              "    const grossInputAmount = String(totalInputRaw ?? '')\n    const amountReady = /^[1-9]\\d*$/.test(grossInputAmount)\n    const routeSetKey = candidateRoutes\n",
          )
          replace_once(
              path,
              "    const routeReady = candidateRoutes.length > 0 && /^[1-9]\\d*$/.test(grossInputAmount)\n",
              "    const routeReady = candidateRoutes.length > 0 && amountReady\n",
          )
          replace_once(
              path,
              "        status: !eligible\n            ? 'idle'\n",
              "        status: !eligible || !amountReady\n            ? 'idle'\n",
          )

          # Base input/wallet actions take priority over the Gas Assist overlay,
          # and a direct Gas Assist failure gets a visible human-readable reason.
          path = 'src/features/swap/model/swapViewModel.js'
          replace_once(
              path,
              "}) {\n    if (crossChainGasAssistDirect && ['idle', 'loading'].includes(crossChainGasAssistStatus)) {\n",
              "}) {\n    if ([\n        'connect',\n        'switch-network',\n        'select-token',\n        'enter-amount',\n        'transaction-pending',\n        'transaction-submitted',\n    ].includes(action?.type)) {\n        return action\n    }\n    if (crossChainGasAssistDirect && ['idle', 'loading'].includes(crossChainGasAssistStatus)) {\n",
          )
          replace_once(
              path,
              "    const crossChainGasAssistTier = getCrossChainGasAssistTier({\n",
              "    const crossChainGasAssistErrorMessage =\n        crossChainGasAssistDirect && crossChainGasAssist?.status === 'error'\n            ? crossChainGasAssist?.error?.message ??\n              'An error happened on our side. Please try again later.'\n            : null\n    const crossChainGasAssistTier = getCrossChainGasAssistTier({\n",
          )
          replace_once(
              path,
              "                    showExecutionMessage: catalog.nativeBalance.value === 0n,\n                    statusMessage,\n",
              "                    showExecutionMessage: catalog.nativeBalance.value === 0n,\n                    statusMessage: statusMessage ?? crossChainGasAssistErrorMessage,\n",
          )

          # Cross-chain HTTP failures should distinguish user, connection, rate-limit,
          # and server-side problems without leaking raw backend text for 5xx errors.
          path = 'src/features/cross-chain/services/crossChainRoutes.js'
          replace_once(
              path,
              "async function requestJson(url, options = {}) {\n    const response = await fetch(url, options)\n    const payload = await response.json().catch(() => null)\n",
              "async function requestJson(url, options = {}) {\n    let response\n    try {\n        response = await fetch(url, options)\n    } catch (cause) {\n        if (cause?.name === 'AbortError') throw cause\n        const error = new Error(\n            'Could not reach PistachioSwap. Check your connection and try again.',\n        )\n        error.code = 'NETWORK_ERROR'\n        throw error\n    }\n    const payload = await response.json().catch(() => null)\n",
          )
          replace_once(
              path,
              "            CROSS_CHAIN_NOT_CONFIGURED: 'Cross-chain routing is not configured.',\n",
              "            CROSS_CHAIN_NOT_CONFIGURED: 'An error happened on our side. Please try again later.',\n            RATE_LIMITED: 'Too many swap requests were sent in a short time. Wait a moment and try again.',\n            CROSS_CHAIN_PROVIDER_RATE_LIMITED: 'Swap providers are temporarily busy. Wait a moment and try again.',\n            REQUEST_FAILED: 'An error happened on our side. Please try again later.',\n",
          )
          replace_once(
              path,
              "            CROSS_CHAIN_PROVIDER_UNAVAILABLE: 'Cross-chain routes are temporarily unavailable.',\n",
              "            CROSS_CHAIN_PROVIDER_UNAVAILABLE: 'An error happened on our side. Please try again later.',\n",
          )
          replace_once(
              path,
              "        const error = new Error(messages[code] ?? payload?.error?.message ??\n            payload?.message ?? 'Cross-chain service is unavailable.')\n",
              "        const error = new Error(\n            messages[code] ??\n            (response.status >= 500\n                ? 'An error happened on our side. Please try again later.'\n                : payload?.error?.message ??\n                  payload?.message ??\n                  'The request could not be completed.'),\n        )\n",
          )

          # Gas Assist's dedicated error surface uses the same user-facing policy.
          path = 'src/features/gas-assist/components/GasAssistError.jsx'
          replace_once(
              path,
              "const messages = {\n",
              "const messages = {\n    RATE_LIMITED: 'Too many swap requests were sent in a short time. Wait a moment and try again.',\n    CROSS_CHAIN_PROVIDER_RATE_LIMITED: 'Swap providers are temporarily busy. Wait a moment and try again.',\n    REQUEST_FAILED: 'An error happened on our side. Please try again later.',\n    SPONSORSHIP_FAILED: 'An error happened on our side. Please try again later.',\n    SPONSORSHIP_PREVIEW_FAILED: 'An error happened on our side. Please try again later.',\n",
          )

          # Non-mutating sponsorship preview gets normalized messages too.
          path = 'src/features/gas-assist/services/sponsorshipPreview.js'
          replace_once(
              path,
              "            'Could not load the Gas Assist preview.',\n",
              "            'Could not reach PistachioSwap. Check your connection and try again.',\n",
          )
          replace_once(
              path,
              "    if (!response.ok) {\n        throw previewError(\n            payload?.error?.code ?? 'SPONSORSHIP_PREVIEW_FAILED',\n            payload?.error?.message ?? 'Gas Assist could not preview this swap.',\n            payload?.error?.details ?? {},\n        )\n    }\n",
              "    if (!response.ok) {\n        const code = payload?.error?.code ?? 'SPONSORSHIP_PREVIEW_FAILED'\n        const message = code === 'RATE_LIMITED'\n            ? 'Too many swap requests were sent in a short time. Wait a moment and try again.'\n            : response.status >= 500\n                ? 'An error happened on our side. Please try again later.'\n                : payload?.error?.message ?? 'Gas Assist could not preview this swap.'\n        throw previewError(code, message, {\n            ...(payload?.error?.details ?? {}),\n            status: response.status,\n        })\n    }\n",
          )

          # The public API is loopback-bound behind the production reverse proxy.
          # Preserve explicit configuration, but do not collapse every user into
          # the proxy's IP when TRUST_PROXY_HOPS was accidentally omitted.
          path = 'apps/api/src/app.ts'
          replace_once(
              path,
              "function readTrustProxy() {\n    const raw = process.env.TRUST_PROXY_HOPS?.trim()\n    if (!raw || raw === '0') return false\n",
              "function readTrustProxy() {\n    const raw = process.env.TRUST_PROXY_HOPS?.trim()\n    if (!raw) {\n        const host = process.env.HOST?.trim().toLowerCase()\n        if (\n            process.env.NODE_ENV === 'production' &&\n            ['127.0.0.1', '::1', 'localhost'].includes(host ?? '')\n        ) return 1\n        return false\n    }\n    if (raw === '0') return false\n",
          )
          replace_once(
              path,
              "                    statusCode === 429\n                        ? 'Too many requests.'\n                        : 'The request could not be completed.',\n",
              "                    statusCode === 429\n                        ? 'Too many requests were sent in a short time. Please wait and try again.'\n                        : statusCode >= 500\n                          ? 'An error happened on our side. Please try again later.'\n                          : 'The request could not be completed.',\n",
          )

          # Reduced-mode production deployments should carry the intended proxy setting.
          path = 'scripts/deploy/activate-vps-release.sh'
          replace_once(
              path,
              "HOST=127.0.0.1\nCORS_ORIGINS=",
              "HOST=127.0.0.1\nTRUST_PROXY_HOPS=1\nCORS_ORIGINS=",
          )

          # Regression tests for zero amount and user-visible error behavior.
          path = 'src/features/swap/model/swapViewModel.test.js'
          replace_once(
              path,
              "    it('shows progress while a zero-BNB direct Gas Assist quote is loading', () => {\n",
              "    it('keeps the enter-amount action before Gas Assist has a positive input', () => {\n        const enterAmountAction = {\n            type: 'enter-amount',\n            label: 'Enter an amount',\n            enabled: false,\n        }\n        expect(getPrimaryActionPresentation({\n            action: enterAmountAction,\n            crossChainGasAssistDirect: true,\n            crossChainGasAssistStatus: 'loading',\n        })).toBe(enterAmountAction)\n    })\n\n    it('shows progress while a zero-BNB direct Gas Assist quote is loading', () => {\n",
          )

          path = 'src/features/cross-chain/hooks/useCrossChainGasAssist.test.jsx'
          replace_once(
              path,
              "    it('keeps the direct Gas Assist CTA loading until a cross-chain route exists', async () => {\n",
              "    it('stays idle and does not preview Gas Assist before a positive amount exists', () => {\n        const input = props({ totalInputRaw: '0' })\n        const { result } = renderHook((value) => useCrossChainGasAssist(value), {\n            initialProps: input,\n        })\n\n        expect(result.current.status).toBe('idle')\n        expect(input.previewSponsorship).not.toHaveBeenCalled()\n    })\n\n    it('keeps the direct Gas Assist CTA loading until a cross-chain route exists', async () => {\n",
          )

          path = 'src/features/cross-chain/services/crossChainRoutes.test.js'
          replace_once(
              path,
              ".rejects.toThrow('Cross-chain routing is not configured.')\n",
              ".rejects.toThrow('An error happened on our side. Please try again later.')\n",
          )
          anchor = "    it('compares arbitrarily large integer amounts and decimal fees without Number coercion', () => {\n"
          addition = """    it('maps API rate limits to an actionable wait message', async () => {
        vi.stubGlobal('fetch', vi.fn().mockResolvedValue({
            ok: false,
            status: 429,
            json: async () => ({ error: { code: 'RATE_LIMITED', message: 'Too many requests.' } }),
        }))
        const request = createCrossChainRouteRequest({
            sourceChainId: 56,
            destinationChainId: 1,
            sourceToken: '0x0000000000000000000000000000000000000001',
            destinationToken: '0x0000000000000000000000000000000000000002',
            amount: '100',
            account: '0x0000000000000000000000000000000000000003',
        })
        await expect(fetchCrossChainRoutes({ endpoint: 'https://api.example', request }))
            .rejects.toThrow('Too many swap requests were sent in a short time. Wait a moment and try again.')
        vi.unstubAllGlobals()
    })

"""
          replace_once(path, anchor, addition + anchor)

          workflow = Path('.github/workflows/fix-swap-feedback.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused regression tests
        run: >-
          pnpm exec vitest run
          src/features/swap/model/swapViewModel.test.js
          src/features/cross-chain/hooks/useCrossChainGasAssist.test.jsx
          src/features/cross-chain/services/crossChainRoutes.test.js

      - name: API typecheck
        run: pnpm --filter @pistachio/api typecheck

      - name: Lint
        run: pnpm lint

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: improve swap loading and error feedback'
          git push origin HEAD:main
