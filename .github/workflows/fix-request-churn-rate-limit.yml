name: Apply request churn and rate limit fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-request-churn-rate-limit.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Patch request churn and rate limiting
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected patch anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # The SPA legitimately performs several read/poll requests while a swap is
          # confirming. 90 requests/minute was too close to normal application load.
          # Keep the protection, but give normal users headroom and make it configurable.
          path = 'apps/api/src/app.ts'
          replace_once(
              path,
              "function failClosedWalletPrices(tokens: WalletToken[]) {\n",
              "function readApiRateLimitMax() {\n"
              "    const raw = process.env.API_RATE_LIMIT_MAX?.trim()\n"
              "    if (!raw) return 300\n"
              "    const max = Number(raw)\n"
              "    if (!Number.isSafeInteger(max) || max < 60 || max > 10_000) {\n"
              "        throw new Error('API_RATE_LIMIT_MAX must be an integer from 60 through 10000.')\n"
              "    }\n"
              "    return max\n"
              "}\n\n"
              "function failClosedWalletPrices(tokens: WalletToken[]) {\n",
          )
          replace_once(
              path,
              "    app.register(rateLimit, {\n        max: 90,\n        timeWindow: '1 minute',\n    })\n",
              "    app.register(rateLimit, {\n        max: readApiRateLimitMax(),\n        timeWindow: '1 minute',\n    })\n",
          )

          # Document the knob. Production defaults to 300/minute when omitted.
          for path in ['apps/api/.env.example', 'apps/api/.env.production.example']:
              p = Path(path)
              text = p.read_text()
              if 'API_RATE_LIMIT_MAX=' in text:
                  continue
              anchor = 'TRUST_PROXY_HOPS=1\n'
              if anchor in text:
                  text = text.replace(
                      anchor,
                      anchor + '\n# Per-client public API request limit per minute. Defaults to 300.\nAPI_RATE_LIMIT_MAX=300\n',
                      1,
                  )
              else:
                  text += '\n# Per-client public API request limit per minute. Defaults to 300.\nAPI_RATE_LIMIT_MAX=300\n'
              p.write_text(text)

          # Avoid restarting/aborting an in-flight sponsorship status fetch merely
          # because React produced a new order object or callback identity.
          path = 'src/features/gas-assist/hooks/usePrepaidSponsorship.js'
          replace_once(
              path,
              "    const forceImmediatePollRef = useRef(false)\n",
              "    const forceImmediatePollRef = useRef(false)\n"
              "    const onConfirmedRef = useRef(onConfirmed)\n"
              "    const onSubmittedRef = useRef(onSubmitted)\n",
          )
          replace_once(
              path,
              "    useEffect(() => {\n        walletEpochRef.current += 1\n",
              "    useEffect(() => {\n"
              "        onConfirmedRef.current = onConfirmed\n"
              "    }, [onConfirmed])\n\n"
              "    useEffect(() => {\n"
              "        onSubmittedRef.current = onSubmitted\n"
              "    }, [onSubmitted])\n\n"
              "    useEffect(() => {\n        walletEpochRef.current += 1\n",
          )
          replace_once(
              path,
              "    useEffect(() => {\n        const sessionToken = sessionTokenRef.current\n        const orderId = state.order?.id\n        const walletEpoch = walletEpochRef.current\n        const flowEpoch = flowEpochRef.current\n        if (!state.open || !orderId || state.order?.isPreview === true || !sessionToken ||\n            ['completed', 'expired', 'rejected', 'failed'].includes(state.order.status)) return undefined\n",
              "    const pollOrderId = state.order?.id ?? null\n"
              "    const pollOrderIsPreview = state.order?.isPreview === true\n"
              "    const pollOrderStatus = state.order?.status ?? null\n\n"
              "    useEffect(() => {\n"
              "        const sessionToken = sessionTokenRef.current\n"
              "        const orderId = pollOrderId\n"
              "        const walletEpoch = walletEpochRef.current\n"
              "        const flowEpoch = flowEpochRef.current\n"
              "        if (!state.open || !orderId || pollOrderIsPreview || !sessionToken ||\n"
              "            ['completed', 'expired', 'rejected', 'failed'].includes(pollOrderStatus)) return undefined\n",
          )
          replace_once(
              path,
              "                    await onSubmitted?.(order)\n",
              "                    await onSubmittedRef.current?.(order)\n",
          )
          replace_once(
              path,
              "                    await onConfirmed?.(order)\n",
              "                    await onConfirmedRef.current?.(order)\n",
          )
          replace_once(
              path,
              "    }, [isCurrent, onConfirmed, onSubmitted, quoteEndpoint, state.open, state.order, state.pollRevision])\n",
              "    }, [\n"
              "        isCurrent,\n"
              "        pollOrderId,\n"
              "        pollOrderIsPreview,\n"
              "        pollOrderStatus,\n"
              "        quoteEndpoint,\n"
              "        state.open,\n"
              "        state.pollRevision,\n"
              "    ])\n",
          )

          # The one-shot workflow removes itself after producing the tested commit.
          Path('.github/workflows/fix-request-churn-rate-limit.yml').unlink(missing_ok=True)
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API typecheck
        run: pnpm --filter @pistachio/api typecheck

      - name: Lint
        run: pnpm lint

      - name: Focused sponsorship tests
        run: >-
          pnpm exec vitest run
          src/features/gas-assist/services/prepaidSponsorship.test.js
          src/features/cross-chain/hooks/useCrossChainGasAssist.test.jsx

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: reduce request churn and raise API rate limit'
          git push origin HEAD:main
