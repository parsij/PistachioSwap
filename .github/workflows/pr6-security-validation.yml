name: PR 6 security validation

on:
  push:
    branches:
      - review/pr6-security-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: API typecheck
        run: pnpm --filter @pistachio/api typecheck

      - name: Full unit tests
        run: pnpm test

      - name: Frontend build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build

      - name: Third-party license audit
        run: pnpm licenses:audit

      - name: Public release tree audit
        run: pnpm release-tree:audit

      - name: Private Gas Assist boundary audit
        run: pnpm audit:private-gas-assist-boundary

      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD
