name: Temporary Gas Assist API test isolation

on:
  push:
    branches:
      - refactor/particle-browser-policy

permissions:
  contents: read

jobs:
  proxy-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - test/gas-assist-proxy-boundary.test.ts
          - test/gas-assist-proxy.test.ts
          - test/gas-assist-proxy-path.test.ts
          - test/gas-assist-proxy-geo.test.ts
    name: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run isolated API test
        run: pnpm --filter @pistachio/api exec vitest run "${{ matrix.file }}"
