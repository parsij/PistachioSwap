name: Temporary Gas Assist API test isolation

on:
  push:
    branches:
      - refactor/particle-browser-policy

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.tests.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: tests
        shell: bash
        run: |
          files=$(find apps/api/test -maxdepth 1 -type f -name '*.test.ts' -printf '%f\n' | sort | node -e "const fs=require('fs'); const a=fs.readFileSync(0,'utf8').trim().split(/\n+/).filter(Boolean); process.stdout.write(JSON.stringify(a))")
          echo "files=$files" >> "$GITHUB_OUTPUT"

  api-test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    name: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run isolated API test
        run: pnpm --filter @pistachio/api exec vitest run "test/${{ matrix.file }}"
