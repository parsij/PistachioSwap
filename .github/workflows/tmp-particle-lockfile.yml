name: Temporary Particle lockfile refresh

on:
  push:
    branches:
      - refactor/particle-browser-policy

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/particle-browser-policy
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Refresh frozen dependency graph
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile only
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'Update lockfile for Particle Universal Account SDK'
          git pull --rebase origin refactor/particle-browser-policy
          git push origin HEAD:refactor/particle-browser-policy
