name: Contributor Assignment Agreement

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  verify-acceptance:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    name: Verify CAA v1.2 acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify PR-author acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          node <<'NODE'
          const token = process.env.GH_TOKEN;
          const apiUrl = process.env.GITHUB_API_URL;
          const repository = process.env.REPOSITORY;
          const repositoryOwner = process.env.REPOSITORY_OWNER;
          const prNumber = Number(process.env.PR_NUMBER);
          const statusContext = 'CAA v1.2 / PR-author acceptance';

          const checkboxStatement =
            'I have read and agree to the PistachioSwap Contributor Assignment Agreement Version 1.2. By checking this box from my authenticated GitHub account, I intend this action to serve as my electronic signature. I confirm that I own or control the rights I am assigning, have authority to assign them, and understand that this Agreement covers my applicable existing and future PistachioSwap Contributions as described in the Agreement.';

          const commentStatement =
            'I have read and agree to the PistachioSwap Contributor Assignment Agreement Version 1.2. I am the person controlling the GitHub account that opened this pull request. By posting this comment from that authenticated GitHub account, I intend this comment to serve as my electronic signature. I confirm that I own or control the rights I am assigning, have authority to assign them, and understand that this Agreement covers my applicable existing and future PistachioSwap Contributions as described in the Agreement.';

          if (!token || !apiUrl || !repository || !repositoryOwner || !Number.isSafeInteger(prNumber)) {
            throw new Error('Missing GitHub event context needed to verify CAA acceptance.');
          }

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json',
            'X-GitHub-Api-Version': '2022-11-28',
          };

          async function githubRequest(path, options = {}) {
            const response = await fetch(`${apiUrl}${path}`, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
            });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status} for ${path}`);
            }
            if (response.status === 204) return null;
            return response.json();
          }

          async function listComments() {
            const comments = [];
            for (let page = 1; ; page += 1) {
              const batch = await githubRequest(
                `/repos/${repository}/issues/${prNumber}/comments?per_page=100&page=${page}`,
              );
              comments.push(...batch);
              if (batch.length < 100) return comments;
            }
          }

          async function setStatus(sha, state, description) {
            await githubRequest(`/repos/${repository}/statuses/${sha}`, {
              method: 'POST',
              body: JSON.stringify({
                state,
                context: statusContext,
                description: description.slice(0, 140),
              }),
            });
          }

          const pr = await githubRequest(`/repos/${repository}/pulls/${prNumber}`);
          const authorLogin = pr.user?.login;
          const authorId = pr.user?.id;
          const headSha = pr.head?.sha;

          if (!authorLogin || !Number.isSafeInteger(authorId) || !headSha) {
            throw new Error('Could not identify the pull request author and head commit.');
          }

          async function fail(message, detail) {
            await setStatus(headSha, 'failure', message);
            console.error(message);
            if (detail) console.error(detail);
            process.exit(1);
          }

          if (authorLogin === repositoryOwner) {
            await setStatus(
              headSha,
              'success',
              `CAA v1.2 not required for repository owner @${authorLogin}.`,
            );
            console.log(`CAA v1.2 NOT REQUIRED for repository owner @${authorLogin}.`);
            process.exit(0);
          }

          const body = pr.body || '';
          const checkboxAccepted = body
            .split(/\r?\n/)
            .some((line) =>
              /^\s*-\s*\[[xX]\]\s+/.test(line) &&
              line.includes(checkboxStatement),
            );

          if (!checkboxAccepted) {
            await fail(
              `CAA v1.2 checkbox missing for @${authorLogin}.`,
              'The pull request author must personally check the exact CAA v1.2 acceptance box in the PR description.',
            );
          }

          const comments = await listComments();
          const acceptance = comments.find((comment) =>
            comment.user?.id === authorId &&
            comment.user?.login === authorLogin &&
            comment.user?.type === 'User' &&
            String(comment.body || '').trim() === commentStatement,
          );

          if (!acceptance) {
            await fail(
              `CAA v1.2 author comment missing for @${authorLogin}.`,
              'Only the exact acceptance comment posted by the same GitHub login and numeric user ID that opened the PR counts. Maintainer, owner, bot, and other-user comments do not count.',
            );
          }

          await setStatus(
            headSha,
            'success',
            `CAA v1.2 accepted by PR author @${authorLogin}.`,
          );

          console.log(`CAA v1.2 accepted by PR author @${authorLogin} (GitHub user id ${authorId}).`);
          console.log(`PR head commit: ${headSha}`);
          console.log(`Acceptance comment: ${acceptance.html_url}`);
          console.log(`Acceptance timestamp: ${acceptance.created_at}`);
          NODE
