name: Restore cross-chain Gas Assist frontend wiring

on:
  push:
    branches:
      - fix/atomic-cross-chain-gas-assist
    paths:
      - .github/workflows/_apply-cross-chain-gas-assist-fix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atomic-cross-chain-gas-assist
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - name: Apply source patch
        run: python3 scripts/_apply-cross-chain-gas-assist-fix.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cross-chain regression tests
        run: pnpm exec vitest run src/App.wallet.test.jsx src/features/cross-chain/services/crossChainRoutes.test.js src/features/swap/model/swapEligibility.test.js
      - name: Build
        run: pnpm build
      - name: Commit validated fix
        shell: bash
        run: |
          git rm .github/workflows/_apply-cross-chain-gas-assist-fix.yml scripts/_apply-cross-chain-gas-assist-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore atomic cross-chain Gas Assist frontend'
          git push origin HEAD:fix/atomic-cross-chain-gas-assist
