name: Refresh fast-uri lockfile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-fast-uri-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Pin patched fast-uri release lines
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.pnpm ??= {}
          pkg.pnpm.overrides ??= {}
          pkg.pnpm.overrides['fast-uri@3'] = '^3.1.6'
          pkg.pnpm.overrides['fast-uri@4'] = '^4.1.3'
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

      - name: Regenerate and verify lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level=high

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No lockfile changes required.'
            exit 0
          fi
          git commit -m 'chore: patch fast-uri security releases'
          git push origin HEAD:main
