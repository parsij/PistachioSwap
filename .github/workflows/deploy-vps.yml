name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.34.5'
  API_SERVICE: pistachioswap-api
  PUBLIC_ORIGIN: https://pistachioswap.com

jobs:
  build-test-deploy:
    name: Build, test, and deploy to VPS
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Validate deployment secrets
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail

          for name in \
            VPS_SSH_KEY \
            VPS_KNOWN_HOSTS \
            VPS_PORT \
            VPS_USER \
            VPS_HOST \
            VPS_APP_DIR
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

          if [[ ! "$VPS_PORT" =~ ^[0-9]+$ ]] ||
            (( VPS_PORT < 1 || VPS_PORT > 65535 ))
          then
            echo "::error::VPS_PORT must be an integer from 1 through 65535."
            exit 1
          fi

          if [[ "$VPS_APP_DIR" != /* || "$VPS_APP_DIR" =~ [[:space:]] ]]; then
            echo "::error::VPS_APP_DIR must be an absolute path without whitespace."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security gate
        shell: bash
        run: |
          set -uo pipefail

          audit_output="$(mktemp)"
          trap 'rm -f "$audit_output"' EXIT

          set +e
          timeout --signal=TERM --kill-after=5s 45s \
            pnpm audit \
              --prod \
              --audit-level=high \
              --ignore-registry-errors \
            2>&1 | tee "$audit_output"
          status=${PIPESTATUS[0]}
          set -e

          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi

          if [[ "$status" -eq 124 || "$status" -eq 137 ]]; then
            echo "::warning::Dependency audit timed out; continuing deployment."
            exit 0
          fi

          if grep -Eiq \
            'ERR_SOCKET_TIMEOUT|ETIMEDOUT|ECONNRESET|EAI_AGAIN|ENOTFOUND|ERR_PNPM_AUDIT_BAD_RESPONSE' \
            "$audit_output"
          then
            echo "::warning::Dependency audit registry is unavailable; continuing deployment."
            exit 0
          fi

          exit "$status"

      - name: Lint
        run: pnpm lint

      - name: API typecheck
        run: pnpm --filter @pistachio/api typecheck

      - name: Deployment tests
        run: pnpm test

      - name: Prepare SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          sed -i 's/\r$//' ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

      - name: Fetch public frontend build configuration
        shell: bash
        env:
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail

          frontend_env="$RUNNER_TEMP/frontend-build.env"
          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -P "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/env/frontend-build.env" \
            "$frontend_env"

          test -s "$frontend_env"
          sed -i 's/\r$//' "$frontend_env"
          cp "$frontend_env" .env.production.local

      - name: Build and hash production frontend
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_API_BASE_URL: https://pistachioswap.com/api
          VITE_DEFAULT_CHAIN_ID: '56'
          VITE_VERSION: ${{ github.sha }}
          PISTACHIO_SOURCE_COMMIT: ${{ github.sha }}
          PISTACHIO_SOURCE_REF: refs/heads/main
          PISTACHIO_PUBLIC_ORIGIN: ${{ env.PUBLIC_ORIGIN }}
          PISTACHIO_BUILD_WORKFLOW: .github/workflows/deploy-vps.yml
        run: |
          set -euo pipefail
          trap 'rm -f .env.production.local' EXIT

          pnpm build
          pnpm frontend:manifest
          pnpm frontend:verify-build

          if grep -RFl 'http://localhost:3001' dist >/dev/null 2>&1; then
            echo "::error::Production frontend still contains the localhost API fallback."
            exit 1
          fi

      - name: License audit
        run: pnpm licenses:audit

      - name: Package verifiable frontend
        shell: bash
        run: |
          set -euo pipefail

          staging_dir="$RUNNER_TEMP/pistachioswap-release"
          frontend_archive="$staging_dir/pistachioswap-frontend-${GITHUB_SHA}.tar.gz"
          mkdir -p "$staging_dir"

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$frontend_archive" \
            -C dist \
            .

          cp \
            dist/.well-known/pistachio-build-manifest.json \
            "$staging_dir/pistachio-build-manifest.json"

          (
            cd "$staging_dir"
            sha256sum \
              "pistachioswap-frontend-${GITHUB_SHA}.tar.gz" \
              > "pistachioswap-frontend-${GITHUB_SHA}.tar.gz.sha256"
          )

      - name: Attest frontend manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/.well-known/pistachio-build-manifest.json

      - name: Attest frontend archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/pistachioswap-release/pistachioswap-frontend-${{ github.sha }}.tar.gz

      - name: Upload verifiable frontend artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pistachioswap-frontend-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/pistachioswap-release/pistachio-build-manifest.json
            ${{ runner.temp }}/pistachioswap-release/pistachioswap-frontend-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/pistachioswap-release/pistachioswap-frontend-${{ github.sha }}.tar.gz.sha256

      - name: Create verified release archive
        shell: bash
        run: |
          set -euo pipefail

          staging_dir="$RUNNER_TEMP/pistachioswap-release"
          archive="$staging_dir/${GITHUB_SHA}.tar.gz"
          listing="$staging_dir/${GITHUB_SHA}.files"

          tar \
            --exclude-vcs \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='*/node_modules' \
            --exclude='./release' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='*/.env' \
            --exclude='*/.env.*' \
            -czf "$archive" \
            .

          (
            cd "$staging_dir"
            sha256sum "${GITHUB_SHA}.tar.gz" \
              > "${GITHUB_SHA}.tar.gz.sha256"
          )

          tar -tzf "$archive" > "$listing"

          for required_path in \
            ./package.json \
            ./pnpm-lock.yaml \
            ./pnpm-workspace.yaml \
            ./vite.config.js \
            ./apps/api/package.json \
            ./apps/api/src/server.ts \
            ./scripts/deploy/activate-vps-release.sh \
            ./scripts/build/verify-frontend-manifest.mjs \
            ./dist/index.html \
            ./dist/swap/index.html \
            ./dist/.well-known/pistachio-build-manifest.json
          do
            grep -Fxq "$required_path" "$listing" || {
              echo "::error::Release archive is missing $required_path"
              exit 1
            }
          done

          if grep -Eq '(^|/)\.env($|\.)' "$listing"; then
            echo "::error::Release archive contains an environment file."
            exit 1
          fi

          (
            cd "$staging_dir"
            sha256sum -c "${GITHUB_SHA}.tar.gz.sha256"
          )

      - name: Upload release archive
        shell: bash
        env:
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail

          staging_dir="$RUNNER_TEMP/pistachioswap-release"
          printf -v releases_dir_q '%q' "$VPS_APP_DIR/releases"

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "mkdir -p -- $releases_dir_q"

          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -P "$VPS_PORT" \
            "$staging_dir/${GITHUB_SHA}.tar.gz" \
            "$staging_dir/${GITHUB_SHA}.tar.gz.sha256" \
            "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/releases/"

      - name: Deploy and verify release
        shell: bash
        env:
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail

          deployment_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf -v app_dir_q '%q' "$VPS_APP_DIR"
          printf -v sha_q '%q' "$GITHUB_SHA"
          printf -v service_q '%q' "$API_SERVICE"
          printf -v origin_q '%q' "$PUBLIC_ORIGIN"
          printf -v deployment_id_q '%q' "$deployment_id"

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- $app_dir_q $sha_q $service_q $origin_q $deployment_id_q" \
            <<'REMOTE'
          set -euo pipefail

          APP_DIR="$1"
          SHA="$2"
          API_SERVICE="$3"
          PUBLIC_ORIGIN="$4"
          DEPLOYMENT_ID="$5"

          RELEASES_DIR="$APP_DIR/releases"
          RELEASE_DIR="$RELEASES_DIR/${SHA}-${DEPLOYMENT_ID}"
          TARBALL="$RELEASES_DIR/$SHA.tar.gz"
          CHECKSUM="$TARBALL.sha256"

          for command in tar sha256sum bash; do
            command -v "$command" >/dev/null 2>&1 || {
              echo "Required VPS command is missing: $command" >&2
              exit 1
            }
          done

          [[ -f "$TARBALL" ]] || {
            echo "Release archive is missing: $TARBALL" >&2
            exit 1
          }

          [[ -f "$CHECKSUM" ]] || {
            echo "Release checksum is missing: $CHECKSUM" >&2
            exit 1
          }

          (
            cd "$RELEASES_DIR"
            sha256sum -c "$(basename "$CHECKSUM")"
          )

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          tar -xzf "$TARBALL" -C "$RELEASE_DIR"

          deployment_script="$RELEASE_DIR/scripts/deploy/activate-vps-release.sh"
          [[ -s "$deployment_script" ]] || {
            echo "Release deployment script is missing."
            exit 1
          }

          bash "$deployment_script" \
            "$APP_DIR" \
            "$RELEASE_DIR" \
            "$SHA" \
            "$API_SERVICE" \
            "$PUBLIC_ORIGIN"
          REMOTE
