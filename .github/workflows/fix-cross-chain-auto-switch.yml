name: Apply cross-chain auto-switch fix

on:
  push:
    paths:
      - .github/workflows/fix-cross-chain-auto-switch.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Patch cross-chain network switching
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          eligibility = Path('src/features/swap/model/swapEligibility.js')
          text = eligibility.read_text()
          old = """    const baseAction = getSwapActionState({\n        isConnected: walletState.isConnected,\n        isCorrectNetwork: walletState.isCorrectNetwork,\n"""
          new = """    const baseAction = getSwapActionState({\n        isConnected: walletState.isConnected,\n        // Cross-chain execution already switches the connected wallet to the\n        // source chain immediately before authentication/submission. Do not\n        // expose a manual network-switch CTA just because the wallet is\n        // currently displaying another supported chain.\n        isCorrectNetwork: isCrossChain ? true : walletState.isCorrectNetwork,\n"""
          if old not in text:
              raise SystemExit('swapEligibility patch target not found')
          eligibility.write_text(text.replace(old, new, 1))

          controller = Path('src/features/cross-chain/hooks/useCrossChainController.js')
          text = controller.read_text()
          old = "        if (!walletState.isCorrectNetwork) return 'Switch to the source network to continue.'\n"
          if old not in text:
              raise SystemExit('cross-chain route binding patch target not found')
          controller.write_text(text.replace(old, '', 1))

          tests = Path('src/features/swap/model/swapEligibility.test.js')
          text = tests.read_text()
          marker = "describe('cross-chain economic safety', () => {\n"
          addition = """describe('cross-chain network handling', () => {\n    it('does not expose a manual switch-network action before cross-chain review', () => {\n        const result = crossChainEligibility({\n            walletState: { isConnected: true, isCorrectNetwork: false },\n            currentCrossChainRoute: {\n                outputAmount: '378420',\n                costs: { routeCostUsd: '0.01' },\n            },\n        })\n\n        expect(result.action.type).toBe('swap')\n        expect(result.action.type).not.toBe('switch-network')\n    })\n})\n\n"""
          if marker not in text:
              raise SystemExit('swapEligibility test insertion target not found')
          tests.write_text(text.replace(marker, addition + marker, 1))
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused test
        run: pnpm exec vitest run src/features/swap/model/swapEligibility.test.js

      - name: Lint
        run: pnpm lint

      - name: Remove one-time workflow and commit tested fix
        shell: bash
        run: |
          rm .github/workflows/fix-cross-chain-auto-switch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/swap/model/swapEligibility.js \
                  src/features/swap/model/swapEligibility.test.js \
                  src/features/cross-chain/hooks/useCrossChainController.js \
                  .github/workflows/fix-cross-chain-auto-switch.yml
          git commit -m 'fix: auto-switch source chain for cross-chain swaps'
          git push origin HEAD:main
