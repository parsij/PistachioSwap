name: Backend and deploy validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pr-ui-small-swap-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: API typecheck
        run: pnpm --filter @pistachio/api typecheck
      - name: Validate deploy script syntax
        run: bash -n scripts/deploy/activate-vps-release.sh
      - name: Contributor agreement policy regression tests
        run: node scripts/tests/contributor-assignment.test.mjs
      - name: Legal page and navigation regressions
        run: |
          node --test scripts/tests/legal-pages.test.mjs
          pnpm exec vitest run src/app/BrandMenu.test.jsx src/web3/publicRoutes.test.js
      - name: Backend tests
        run: pnpm --filter @pistachio/api test
      - name: Hosted frontend launcher and routing regressions
        run: |
          bash -n scripts/run-frontend.sh
          node --test scripts/tests/hosted-frontend.test.mjs
          pnpm exec vitest run src/lib/apiBaseUrl.test.js src/lib/hostedServiceUrl.test.js
      - name: Gas Assist source capability tests
        run: pnpm exec vitest run src/features/passkey/services/walletWorker.gasAssist.test.js src/features/passkey/services/walletManagerSelfHostedPaymasterSigning.test.js src/services/swapExecutionMode.test.js src/features/gas-assist/services/capabilityRegistry.test.js src/features/wallet/services/walletHistoryMultichain.test.js src/features/gas-assist/services/selfHostedPaymaster.test.js
      - name: Wallet import and receipt reset regressions
        run: pnpm exec vitest run src/features/passkey/components src/features/passkey/services/walletManagerImport.test.js src/features/swap/hooks/useSameChainReceiptLifecycle.test.jsx
      - name: New token transaction state regressions
        run: pnpm exec vitest run src/App.wallet.test.jsx -t 'clears the previous submitted transaction'
      - name: Gas Assist pricing disclosure regressions
        run: pnpm exec vitest run src/features/gas-assist/components/GasAssistBanner.test.jsx src/features/gas-assist/components/GasAssistPrepaymentDialog.test.jsx src/features/gas-assist/components/GasAssistPrepaymentDialog.requote.test.jsx src/features/gas-assist/model/gasAssistFee.test.js
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build
      - name: Verify built legal pages
        run: LEGAL_DIST=dist node --test scripts/tests/legal-pages.test.mjs

