name: Fix cross-chain Gas Assist quote flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cross-chain-gas-assist-quote.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Patch Gas Assist quote flow
        shell: bash
        env:
          PATCH_SCRIPT_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode > /tmp/patch-gas-assist.js
          node /tmp/patch-gas-assist.js

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused tests
        run: pnpm vitest run src/features/swap/model/swapEligibility.test.js src/features/cross-chain/hooks/useCrossChainGasAssist.test.jsx

      - name: Lint
        run: pnpm lint

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/features/swap/model/swapEligibility.js \
            src/features/swap/model/swapEligibility.test.js \
            src/features/swap/hooks/useSwapController.js \
            src/features/cross-chain/hooks/useCrossChainGasAssist.js \
            src/features/cross-chain/hooks/useCrossChainGasAssist.test.jsx \
            src/features/swap/components/SwapDetails.jsx
          git commit -m 'Fix cross-chain Gas Assist quote economics and loading state'
          git push origin HEAD:main
