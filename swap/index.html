    <style>
      /*
       * Static boot shell shown before React mounts. It gives Lighthouse and
       * first-time visitors immediate content instead of a blank page while
       * wallet bundles download and compile.
       */
      .app-boot-shell {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 53px 12px 2rem;
        background: #191919;
        color: #fff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .app-boot-header,
      .app-boot-card {
        width: min(480px, calc(100vw - 24px));
        margin-inline: auto;
      }

      .app-boot-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 72px;
        margin-bottom: 0.5rem;
      }

      .app-boot-brand {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
      }

      .app-boot-brand img {
        width: 24px;
        height: 24px;
      }

      .app-boot-pill {
        width: 108px;
        height: 36px;
        border-radius: 999px;
        background: #252525;
      }

      .app-boot-card {
        padding: 1rem;
        border: 1px solid #353535;
        border-radius: 22px;
        background: #252525;
      }

      .app-boot-panel {
        height: 136px;
        margin-bottom: 0.5rem;
        border-radius: 18px;
        background: #191919;
      }

      .app-boot-panel:last-of-type {
        height: 132px;
      }

      .app-boot-action {
        height: 55px;
        margin-top: 0.75rem;
        border-radius: 18px;
        background: #8ac27c;
      }
      .app-info-footer { position: relative; padding: 2rem 1rem; background: var(--color-background, #191919); color: var(--color-text-secondary, #a9a9a9); font: 13px/1.6 system-ui, sans-serif; text-align: center; }
      .app-info-footer h1 { margin: 0; color: #f4f4f4; font-size: 16px; font-weight: 600; }
      .app-info-footer p { max-width: 580px; margin: 8px auto 12px; }
      .app-info-footer nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 20px; }
      .app-info-footer a { display: inline-flex; align-items: center; min-height: 44px; color: #8ac27c; text-decoration: none; }
      .app-info-footer a:hover { text-decoration: underline; }
      .app-info-footer a:focus-visible { outline: 2px solid #8ac27c; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <div id="wallet-kit-root"></div>
    <div id="root">
      <div class="app-boot-shell" aria-hidden="true">
        <header class="app-boot-header">

            Pistachio Swap
          </div>

        </header>
        <section class="app-boot-card" aria-hidden="true">
          <div class="app-boot-panel"></div>
          <div class="app-boot-panel"></div>
          <div class="app-boot-action"></div>
        </section>
      </div>
      <footer class="app-info-footer" aria-label="About Pistachio Swap">
        <h1>Pistachio Swap</h1>
        <p>Compare crypto swap routes with a self-custodial wallet. Gas Assist is available for eligible BNB Chain swaps; costs apply.</p>
